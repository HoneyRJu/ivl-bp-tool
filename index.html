const RAW = JSON.parse(document.getElementById('data').textContent);
// [map, hunter, tour, win, picks, gbh, gbs, tbh, tbs, use, bo]
const SCOPES = {all:null, summer:['2026IVL夏季赛常规赛','2026IVL夏季赛季后赛'],
  summer_reg:['2026IVL夏季赛常规赛'], summer_po:['2026IVL夏季赛季后赛'],
  autumn:['2026IVL秋季赛常规赛']};
const BAN = [['全局 BAN','监管者角色',5,'amber'],['全局 BAN','求生者角色',6,'cyan'],
             ['针对 BAN','监管者角色',7,'amber'],['针对 BAN','求生者角色',8,'cyan']];
const MC = {};
RAW.forEach(r=>{MC[r[0]]=(MC[r[0]]||0)+1;});
const pct = x => (x*100).toFixed(1)+'%';
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sel = k => document.getElementById(k).value;
const sideOf = () => sel('side')==='s' ? '人' : '屠';
const who = () => sideOf()==='屠' ? '监管者' : '求生者';

function filtered(){
  const s = SCOPES[sel('scope')];
  let rows = s ? RAW.filter(r=>s.includes(r[2])) : RAW.slice();
  const bo = sel('bo');
  if(bo !== 'all') rows = rows.filter(r=>r[10]===bo);
  const mp = sel('map');
  if(mp !== '全部') rows = rows.filter(r=>r[0]===mp);
  if(document.getElementById('new').checked)
    rows = rows.filter(r=>(r[5]&&r[5].length)||(r[6]&&r[6].length));
  return rows;
}
function stats(rows, side){
  const n=rows.length, win=rows.filter(r=>r[3]===side).length,
        draw=rows.filter(r=>r[3]==='平').length, dec=win+(n-win-draw);
  return {n,win,draw,loss:n-win-draw,dec,wr:n?win/n:0,wd:n?(win+draw)/n:0,dr:dec?win/dec:null};
}
function panel(rows, label, sub, idx, color){
  const cnt={}; let has=0;
  for(const r of rows){ const a=r[idx]||[]; if(a.length) has++; for(const x of a) cnt[x]=(cnt[x]||0)+1; }
  const list=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let h='<div class="card"><div class="banhead"><span class="tag '+color+'">'+label+'</span><span class="t">'+sub+'</span></div>';
  if(!list.length) h+='<div class="empty">该范围没有记录这项数据</div>';
  for(const [k,v] of list){
    const p=has?v/has:0;
    h+='<div class="row"><div class="n">'+esc(k)+'</div><div class="bar"><i class="'+color+'" style="width:'+(p*100).toFixed(0)+'%"></i></div><div class="c">'+Math.round(p*100)+'%</div></div>';
  }
  h+='<div class="sub">'+(has?('有记录 '+has+'/'+rows.length+' 场'):'无记录')+'</div></div>';
  return h;
}
function pickPanel(rows, idx, label, color, sub){
  const cnt={};
  for(const r of rows){ const x=r[idx]; if(x) cnt[x]=(cnt[x]||0)+1; }
  const list=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let h='<div class="card"><div class="banhead"><span class="tag '+color+'">'+label+'</span><span class="t">'+sub+'</span></div>';
  for(const [k,v] of list){
    const p=v/rows.length;
    h+='<div class="row"><div class="n">'+esc(k)+'</div><div class="bar"><i class="'+color+'" style="width:'+(p*100).toFixed(0)+'%"></i></div><div class="c">'+Math.round(p*100)+'%</div></div>';
  }
  h+='<div class="sub">样本 '+rows.length+' 场</div></div>';
  return h;
}
function survPickPanel(rows){
  const cnt={};
  for(const r of rows) for(const p of (r[4]||[])) cnt[p]=(cnt[p]||0)+1;
  const list=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  let h='<div class="card"><div class="banhead"><span class="tag green">PICK</span><span class="t">求生者角色出场率</span></div>';
  for(const [k,v] of list){
    const p=v/rows.length;
    h+='<div class="row"><div class="n">'+esc(k)+'</div><div class="bar"><i class="green" style="width:'+(p*100).toFixed(0)+'%"></i></div><div class="c">'+Math.round(p*100)+'%</div></div>';
  }
  h+='<div class="sub">样本 '+rows.length+' 场（每场 4 人，占比可超过 100% 总和）</div></div>';
  return h;
}
function hunterTable(rows, side){
  const cnt={};
  rows.forEach(r=>{ if(r[1]) cnt[r[1]]=(cnt[r[1]]||0)+1; });
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  let h='<table><tr><th>监管者</th><th>场次</th><th>'+who()+'胜率</th><th>'+who()+'胜平率</th><th>'+who()+'去平胜率</th></tr>';
  for(const [k,c] of top){
    const s=stats(rows.filter(r=>r[1]===k), side), dr=s.dr===null?'—':pct(s.dr);
    h+='<tr><td class="name">'+esc(k)+'</td><td>'+c+'</td>'+
      '<td><span class="pill '+(s.wr>=0.5?'hi':'lo')+'">'+pct(s.wr)+'</span></td>'+
      '<td><span class="pill '+(s.wd>=0.5?'hi':'lo')+'">'+pct(s.wd)+'</span></td><td>'+dr+'</td></tr>';
  }
  return h+'</table>';
}
function comboPanel(rows, picked){
  const ex=new Set(picked), cnt={};
  for(const r of rows) for(const p of (r[4]||[])) if(!ex.has(p)) cnt[p]=(cnt[p]||0)+1;
  const list=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let h='<div class="card"><div class="h2">同队另外几手</div>';
  for(const [k,v] of list){
    const p=v/rows.length;
    h+='<div class="row"><div class="n">'+esc(k)+'</div><div class="bar"><i class="cyan" style="width:'+(p*100).toFixed(0)+'%"></i></div><div class="c">'+Math.round(p*100)+'%</div></div>';
  }
  return h+'<div class="sub">样本 '+rows.length+' 场</div></div>';
}

function render(){
  const side=sideOf();
  const rows=filtered();
  const bo=sel('bo'), mp=sel('map');
  const hunter=document.getElementById('hunter').value.trim();
  const survs=document.getElementById('surv').value.split(',').map(s=>s.trim()).filter(Boolean);

  document.getElementById('s-n').textContent=rows.length.toLocaleString();
  const nban=rows.reduce((a,r)=>a+(r[5]?r[5].length:0)+(r[6]?r[6].length:0)+(r[7]?r[7].length:0)+(r[8]?r[8].length:0),0);
  document.getElementById('s-b').textContent=nban.toLocaleString();
  const gbc=rows.filter(r=>(r[5]&&r[5].length)||(r[6]&&r[6].length)).length;
  document.getElementById('s-g').textContent=rows.length?Math.round(gbc/rows.length*100)+'%':'—';

  if(!rows.length){ document.getElementById('body').innerHTML='<div class="card">这个组合没有样本，换个范围试试</div>'; return; }

  const suffix = mp==='全部' ? '' : ' · '+mp;
  let html='';
  if(bo==='BO1'){
    html+='<div class="card"><div class="note">BO1 在规则上<b>没有全局 BAN</b>：292 个 BO1 半场，全局 BAN 字段全部为空。下面两张「全局 BAN」卡片显示「无记录」是规则使然。</div></div>';
  } else if(bo!=='all'){
    html+='<div class="card"><div class="note">当前看 <b>'+bo+'</b>。全局 BAN 从 BO2 起累积：每局追加，前几局禁掉的角色本局不能再上，所以越往后可用的角色池越窄。</div></div>';
  }

  html+='<div class="grid2">';
  for(const [label,sub,idx,color] of BAN) html+=panel(rows,label,sub,idx,color);
  html+='</div>';

  html+='<div class="grid2">';
  html+=pickPanel(rows, 1, 'PICK', 'violet', '监管者选择率');
  html+=survPickPanel(rows);
  html+='</div>';

  if(hunter){
    const sub=rows.filter(r=>r[1]===hunter && (!survs.length || survs.every(s=>(r[4]||[]).includes(s))));
    const s=stats(sub, side);
    if(s.n){
      const dr=s.dr===null?'—':pct(s.dr);
      html+='<div class="card"><div class="h2">'+esc(hunter)+'</div><div class="metrics">'+
        '<div class="metric"><div class="v">'+pct(s.wr)+'</div><div class="k">'+who()+'胜率</div><div class="d">胜/总场次 · '+s.n+' 场</div></div>'+
        '<div class="metric"><div class="v">'+pct(s.wd)+'</div><div class="k">'+who()+'胜平率</div><div class="d">(胜+平)/总场次</div></div>'+
        '<div class="metric"><div class="v">'+dr+'</div><div class="k">'+who()+'去平胜率</div><div class="d">胜/(胜+负) · '+s.dec+' 场</div></div>'+
      '</div><div class="sub">胜 '+s.win+' · 平 '+s.draw+' · 负 '+s.loss+'</div></div>';
    } else {
      html+='<div class="card"><div class="h2">'+esc(hunter)+'</div><div class="empty">没有匹配样本</div></div>';
    }
  }

  html+='<div class="card"><div class="h2">监管者三口径胜率'+suffix+'</div>'+hunterTable(rows, side)+
    '<div class="sub">样本 '+rows.length+' 场 ｜ 胜率=胜/总场次 · 胜平率=(胜+平)/总场次 · 去平胜率=胜/(胜+负) ｜ 视角：'+who()+'</div></div>';

  if(survs.length){
    const sub=rows.filter(r=>survs.every(s=>(r[4]||[]).includes(s)) && (!hunter || r[1]===hunter));
    if(sub.length) html+=comboPanel(sub, survs);
    else html+='<div class="card"><div class="empty">该阵容组合在这个范围里没有样本</div></div>';
  }

  html+='<div class="card"><div class="h2">口径说明</div><div class="note">'+
    '百分比分母是<b>该分类有记录的场次</b>；「全局 BAN」只在 <b>2026 夏季赛常规赛</b>记录（367/894 场），且从 <b>BO2</b> 才开始。<br>'+
    '数据源、源库哈希与复算脚本见 <a href="report-source.html" style="color:#8fb0ff">数据来源</a>。</div></div>';
  html+='<div class="warn">样本 &lt;10 场的结论波动很大，别当铁律。</div>';
  document.getElementById('body').innerHTML=html;
}

['scope','bo','map','side','new'].forEach(id=>document.getElementById(id).addEventListener('change', render));
render();
</script>
</body></html>
